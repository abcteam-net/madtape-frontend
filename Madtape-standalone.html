<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Madtape — Stream & Fund AI Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* Madtape — streaming + funding */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap');

:root {
  --bg: #0a0a0a;
  --bg-1: #141414;
  --bg-2: #1f1f1f;
  --bg-3: #2a2a2a;
  --fg: #ffffff;
  --fg-dim: #b3b3b3;
  --fg-faint: #777777;
  --accent: #e50914;
  --accent-2: #f5c518;
  --good: #46d369;
  --rule: rgba(255,255,255,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--fg); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img, video { display: block; max-width: 100%; }
::selection { background: var(--accent); color: var(--fg); }

/* ============ topnav ============ */
.nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex; align-items: center;
  padding: 18px 56px;
  gap: 28px;
  transition: background 240ms;
}
.nav.scrolled { background: rgba(10,10,10,0.96); backdrop-filter: blur(8px); }
.nav .logo {
  font-family: "Bebas Neue", sans-serif;
  font-size: 32px;
  letter-spacing: 0.02em;
  color: var(--accent);
  font-weight: 400;
}
.nav .links { display: flex; gap: 22px; font-size: 14px; }
.nav .links a { color: var(--fg-dim); transition: color 120ms; }
.nav .links a.active { color: var(--fg); font-weight: 500; }
.nav .links a:hover { color: var(--fg); }
.nav .right { margin-left: auto; display: flex; align-items: center; gap: 20px; font-size: 14px; }
.nav .right .icon { color: var(--fg); cursor: pointer; font-size: 18px; }
.nav .search-pill {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--rule);
  background: rgba(0,0,0,0.5);
  padding: 6px 12px;
  border-radius: 2px;
  color: var(--fg-dim);
}
.nav .search-pill input {
  background: none; border: none; outline: none;
  color: var(--fg); font: inherit; font-size: 13px;
  width: 180px;
}
.nav .search-pill input::placeholder { color: var(--fg-faint); }

.profile {
  width: 32px; height: 32px;
  border-radius: 4px;
  background: linear-gradient(135deg, #e50914, #b00710);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}

/* ============ hero billboard ============ */
.billboard {
  position: relative;
  height: 92vh;
  min-height: 640px;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 56px 120px;
  overflow: hidden;
}
.billboard .bg {
  position: absolute; inset: 0; z-index: 0;
}
.billboard .bg .swatch {
  position: absolute; inset: 0;
}
.billboard .bg .swatch::after {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px),
    radial-gradient(at 30% 30%, rgba(255,255,255,0.12), transparent 65%);
  mix-blend-mode: overlay;
}
.billboard .bg .grad-bottom {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, transparent 0%, transparent 50%, rgba(10,10,10,0.85) 85%, var(--bg) 100%),
    linear-gradient(90deg, rgba(10,10,10,0.9) 0%, rgba(10,10,10,0.5) 40%, transparent 70%);
}
.billboard .content {
  position: relative; z-index: 2;
  max-width: 560px;
}
.billboard .badge {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-2);
  margin-bottom: 14px;
  display: inline-flex; align-items: center; gap: 8px;
}
.billboard .badge::before {
  content: "MADTAPE ORIGINAL";
  font-family: "Bebas Neue", sans-serif;
  font-size: 18px;
  letter-spacing: 0.04em;
  color: var(--accent);
  background: none;
  padding: 0;
  border-right: 2px solid var(--accent);
  padding-right: 12px;
  margin-right: 4px;
}
.billboard h1 {
  font-family: "Bebas Neue", sans-serif;
  font-weight: 400;
  font-size: clamp(56px, 7vw, 112px);
  line-height: 0.92;
  letter-spacing: 0.005em;
  margin-bottom: 18px;
  text-shadow: 0 2px 24px rgba(0,0,0,0.6);
}
.billboard .meta-row {
  display: flex; align-items: center; gap: 16px;
  font-size: 14px;
  color: var(--fg);
  margin-bottom: 18px;
  font-weight: 500;
}
.billboard .meta-row .pill {
  border: 1px solid rgba(255,255,255,0.4);
  padding: 1px 8px;
  font-size: 12px;
}
.billboard .meta-row .match { color: var(--good); font-weight: 700; }
.billboard p {
  font-size: 17px;
  line-height: 1.45;
  color: var(--fg);
  text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  max-width: 520px;
  margin-bottom: 26px;
}
.billboard .cta {
  display: flex; gap: 12px; align-items: center;
}
.billboard .btn {
  padding: 13px 26px;
  font-size: 16px;
  font-weight: 700;
  display: inline-flex; align-items: center; gap: 10px;
  border-radius: 4px;
  transition: opacity 120ms, transform 120ms;
}
.billboard .btn:hover { opacity: 0.85; }
.billboard .btn.play { background: var(--fg); color: #000; }
.billboard .btn.fund { background: var(--accent); color: var(--fg); }
.billboard .btn.info { background: rgba(109,109,110,0.7); color: var(--fg); }
.billboard .btn.info:hover { background: rgba(109,109,110,0.5); }

.billboard .funding-strip {
  margin-top: 24px;
  display: flex; align-items: center; gap: 16px;
  font-size: 13px;
  color: var(--fg-dim);
  max-width: 520px;
}
.billboard .funding-strip .bar {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.18);
  border-radius: 2px;
  overflow: hidden;
}
.billboard .funding-strip .bar i {
  display: block; height: 100%;
  background: var(--accent);
  border-radius: 2px;
}
.billboard .funding-strip b { color: var(--fg); font-weight: 700; }

.billboard .age-tag {
  position: absolute;
  right: 0; bottom: 120px;
  background: rgba(40,40,40,0.7);
  border-left: 3px solid var(--fg-dim);
  padding: 5px 30px 5px 12px;
  font-size: 14px;
  z-index: 2;
}

/* ============ rails ============ */
.rails-wrap {
  position: relative;
  z-index: 3;
  margin-top: -80px;
  padding-bottom: 80px;
}
.rail {
  margin-bottom: 38px;
  position: relative;
}
.rail h2 {
  font-size: 22px;
  font-weight: 700;
  padding: 0 56px;
  margin-bottom: 14px;
  display: flex; align-items: baseline; gap: 12px;
}
.rail h2 .more {
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-dim);
  letter-spacing: 0.02em;
  opacity: 0;
  transition: opacity 200ms;
}
.rail:hover h2 .more { opacity: 1; }
.rail h2 .more::after { content: " ›"; color: var(--accent); }
.rail .scroller {
  display: flex;
  gap: 6px;
  padding: 30px 56px 60px;
  margin: -30px 0 -60px;
  overflow-x: auto;
  overflow-y: visible;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.rail .scroller::-webkit-scrollbar { display: none; }

.tile {
  flex: 0 0 auto;
  width: 280px;
  aspect-ratio: 16/9;
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 280ms cubic-bezier(.2,.8,.2,1), box-shadow 280ms;
  scroll-snap-align: start;
  background: var(--bg-1);
}
.tile:hover {
  transform: scale(1.32) translateY(-12px);
  z-index: 5;
  box-shadow: 0 16px 50px rgba(0,0,0,0.7);
}
.tile .swatch {
  position: absolute; inset: 0;
}
.tile .swatch::after {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px),
    radial-gradient(at 30% 30%, rgba(255,255,255,0.18), transparent 60%);
  mix-blend-mode: overlay;
}
.tile .swatch::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.85));
}
.tile .pno {
  position: absolute; top: 8px; left: 10px;
  font-size: 9px; letter-spacing: 0.16em;
  color: rgba(255,255,255,0.85);
  font-weight: 600;
}
.tile .ttl {
  position: absolute; bottom: 10px; left: 12px; right: 12px;
  font-family: "Bebas Neue", sans-serif;
  font-size: 22px;
  line-height: 1;
  letter-spacing: 0.01em;
  color: #fff;
  text-shadow: 0 1px 8px rgba(0,0,0,0.6);
}
.tile .badge-fund {
  position: absolute; top: 8px; right: 8px;
  background: var(--accent);
  color: var(--fg);
  font-size: 9px;
  letter-spacing: 0.12em;
  font-weight: 700;
  padding: 3px 6px;
  text-transform: uppercase;
  border-radius: 2px;
  z-index: 2;
}

/* tile hover-card content */
.tile .hover {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.0) 60%, rgba(20,20,20,0.95));
  opacity: 0; transition: opacity 200ms 80ms;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 12px;
  pointer-events: none;
}
.tile:hover .hover { opacity: 1; }
.tile .hover .controls {
  display: flex; gap: 6px; margin-bottom: 8px;
}
.tile .hover .ctrl {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.6);
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.4);
  color: #fff;
  font-size: 11px;
}
.tile .hover .ctrl.solid { background: #fff; color: #000; border-color: #fff; padding-left: 1px; }
.tile .hover .ctrl.solid.fund { background: var(--accent); color: #fff; border-color: var(--accent); padding: 0; font-size: 13px; font-weight: 700; }
.tile .hover .row {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  color: var(--fg);
}
.tile .hover .match { color: var(--good); font-weight: 700; }
.tile .hover .pill { border: 1px solid rgba(255,255,255,0.4); padding: 0 5px; font-size: 10px; }
.tile .hover .fund-bar {
  margin-top: 6px;
  height: 3px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  overflow: hidden;
}
.tile .hover .fund-bar i {
  display: block; height: 100%;
  background: var(--accent);
}
.tile .hover .fund-text {
  margin-top: 4px;
  font-size: 10px;
  color: var(--fg-dim);
}
.tile .hover .fund-text b { color: #fff; }

/* numbered tiles for "Top 10" rail */
.rail.top10 .scroller { padding-left: 56px; }
.rail.top10 .tile-wrap {
  display: flex; align-items: center;
  flex: 0 0 auto;
  margin-right: 6px;
}
.rail.top10 .tile-num {
  font-family: "Bebas Neue", sans-serif;
  font-size: 220px;
  line-height: 0.78;
  letter-spacing: -0.05em;
  color: #1a1a1a;
  -webkit-text-stroke: 2px #555;
  margin-right: -42px;
  z-index: 1;
}
.rail.top10 .tile {
  width: 200px;
  aspect-ratio: 2/3;
  z-index: 2;
}
.rail.top10 .tile .ttl {
  font-size: 18px;
}

/* ============ funding banner ============ */
.fund-banner {
  margin: 0 56px 60px;
  padding: 32px 40px;
  background: linear-gradient(135deg, #1a0b0c, #0a0a0a);
  border: 1px solid rgba(229,9,20,0.3);
  border-radius: 6px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.fund-banner::before {
  content: ""; position: absolute; right: -20px; top: -20px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(229,9,20,0.15), transparent 70%);
}
.fund-banner h3 {
  font-family: "Bebas Neue", sans-serif;
  font-size: 42px;
  line-height: 0.95;
  letter-spacing: 0.01em;
  margin-bottom: 8px;
}
.fund-banner h3 em {
  font-style: normal;
  color: var(--accent);
}
.fund-banner p {
  color: var(--fg-dim);
  font-size: 14px;
  line-height: 1.5;
  max-width: 560px;
}
.fund-banner .stats {
  display: flex; gap: 32px;
  position: relative; z-index: 1;
}
.fund-banner .stat {
  text-align: right;
}
.fund-banner .stat .v {
  font-family: "Bebas Neue", sans-serif;
  font-size: 38px;
  line-height: 1;
  letter-spacing: 0.01em;
}
.fund-banner .stat .v em { color: var(--accent); font-style: normal; }
.fund-banner .stat .l {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-dim);
  margin-top: 4px;
}

/* ============ footer ============ */
.foot {
  padding: 60px 56px 40px;
  border-top: 1px solid var(--rule);
  color: var(--fg-faint);
  font-size: 13px;
}
.foot .icons { display: flex; gap: 18px; margin-bottom: 24px; font-size: 18px; color: var(--fg-dim); }
.foot .cols {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.foot .cols a { display: block; padding: 4px 0; font-size: 13px; color: var(--fg-faint); }
.foot .cols a:hover { text-decoration: underline; }
.foot .copy { font-size: 11px; }

/* ============ film page ============ */
.film-modal {
  background: var(--bg-1);
  min-height: 100vh;
}
.film-hero {
  position: relative;
  height: 80vh;
  min-height: 540px;
  padding: 120px 56px 60px;
  display: flex; flex-direction: column; justify-content: flex-end;
  overflow: hidden;
}
.film-hero .bg { position: absolute; inset: 0; z-index: 0; }
.film-hero .bg .swatch { position: absolute; inset: 0; }
.film-hero .bg .swatch::after {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px),
    radial-gradient(at 30% 30%, rgba(255,255,255,0.14), transparent 65%);
  mix-blend-mode: overlay;
}
.film-hero .bg .grad {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, transparent 0%, transparent 40%, rgba(20,20,20,0.7) 75%, var(--bg-1) 100%),
    linear-gradient(90deg, rgba(20,20,20,0.85), transparent 60%);
}
.film-hero .back {
  position: absolute; top: 100px; left: 56px;
  z-index: 3;
  font-size: 14px;
  color: var(--fg);
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,0.5);
  padding: 8px 14px;
  border-radius: 4px;
  border: 1px solid var(--rule);
  cursor: pointer;
}
.film-hero .back:hover { background: rgba(0,0,0,0.8); }
.film-hero .content { position: relative; z-index: 2; max-width: 640px; }
.film-hero .badge {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: "Bebas Neue", sans-serif;
  font-size: 18px;
  letter-spacing: 0.04em;
  color: var(--accent);
  margin-bottom: 14px;
}
.film-hero .badge::after {
  content: attr(data-tag);
  font-family: "Inter", sans-serif;
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--accent-2);
  font-weight: 600;
}
.film-hero h1 {
  font-family: "Bebas Neue", sans-serif;
  font-weight: 400;
  font-size: clamp(60px, 7vw, 120px);
  line-height: 0.92;
  letter-spacing: 0.005em;
  margin-bottom: 16px;
}
.film-hero .meta {
  display: flex; gap: 14px; align-items: center;
  font-size: 14px;
  margin-bottom: 18px;
  font-weight: 500;
}
.film-hero .meta .match { color: var(--good); font-weight: 700; }
.film-hero .meta .pill { border: 1px solid rgba(255,255,255,0.4); padding: 1px 8px; font-size: 12px; }
.film-hero .syn {
  font-size: 17px;
  line-height: 1.5;
  max-width: 560px;
  margin-bottom: 24px;
}
.film-hero .actions { display: flex; gap: 12px; }
.film-hero .btn {
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 4px;
  display: inline-flex; align-items: center; gap: 8px;
}
.film-hero .btn.play { background: var(--fg); color: #000; }
.film-hero .btn.fund { background: var(--accent); color: var(--fg); }
.film-hero .btn.icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(40,40,40,0.6);
  padding: 0;
  justify-content: center;
}

/* ============ funding panel (the centerpiece) ============ */
.fund-panel {
  margin: -80px 56px 60px;
  background: linear-gradient(180deg, #1c1c1c, #141414);
  border: 1px solid rgba(229,9,20,0.25);
  border-radius: 8px;
  position: relative;
  z-index: 4;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}
.fund-panel .left { padding: 36px 40px; border-right: 1px solid var(--rule); }
.fund-panel .right { padding: 36px 40px; background: rgba(0,0,0,0.3); }

.fund-panel .head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
}
.fund-panel .head .label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
}
.fund-panel .head .label::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.fund-panel .head .ddl {
  font-size: 13px; color: var(--fg-dim);
}
.fund-panel .head .ddl b { color: var(--fg); }

.fund-panel h3 {
  font-family: "Bebas Neue", sans-serif;
  font-size: 38px;
  line-height: 1;
  margin-bottom: 18px;
  letter-spacing: 0.005em;
}
.fund-panel h3 em { color: var(--accent); font-style: normal; }

.fund-progress {
  margin-bottom: 22px;
}
.fund-progress .row1 {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.fund-progress .row1 .raised {
  font-family: "Bebas Neue", sans-serif;
  font-size: 44px;
  line-height: 1;
}
.fund-progress .row1 .raised em { color: var(--accent); font-style: normal; }
.fund-progress .row1 .of {
  font-size: 13px; color: var(--fg-dim);
}
.fund-progress .row1 .of b { color: var(--fg); }
.fund-progress .bar {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
}
.fund-progress .bar i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent), #ff3a44);
  border-radius: 4px;
}
.fund-progress .row2 {
  display: flex; justify-content: space-between; margin-top: 10px;
  font-size: 12px; color: var(--fg-dim);
}
.fund-progress .row2 b { color: var(--fg); }

.tier-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}
.tier {
  padding: 14px 12px;
  border: 1.5px solid var(--rule);
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
  background: rgba(0,0,0,0.25);
  transition: all 160ms;
  position: relative;
}
.tier:hover { border-color: rgba(229,9,20,0.5); }
.tier.active {
  border-color: var(--accent);
  background: rgba(229,9,20,0.1);
}
.tier .amt {
  font-family: "Bebas Neue", sans-serif;
  font-size: 28px;
  line-height: 1;
  letter-spacing: 0.005em;
}
.tier .nm {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--fg-dim); margin-top: 4px;
}
.tier .perk {
  font-size: 11px;
  color: var(--fg-dim);
  margin-top: 8px;
  line-height: 1.3;
}
.tier.active .perk { color: var(--fg); }

.fund-row {
  display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
}
.fund-input {

function shadeC(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt; r = Math.max(0, Math.min(255, r));
  let g = ((n >> 8) & 0xff) + amt; g = Math.max(0, Math.min(255, g));
  let b = (n & 0xff) + amt; b = Math.max(0, Math.min(255, b));
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

      </div>

}

function FundPanel({ film, user, onLogin, onPledge }) {
  const isShort = parseInt(film.runtime) < 60;
  const [tier, setTier] = useStateP(isShort ? 25 : 50);
  const [custom, setCustom] = useStateP("");
  const [success, setSuccess] = useStateP(false);
  const [feed, setFeed] = useStateP(window.LIVE_EVENTS.slice(0, 4));
  const [raised, setRaised] = useStateP(film.raised);
  const goalCap = isShort ? 10000 : 250000;
  const minRuntime = isShort ? "8 min" : "1h 45m";

  // simulated live feed
  useEffectP(() => {
    if (film.funded) return;
    const t = setInterval(() => {
      const ev = window.LIVE_EVENTS[Math.floor(Math.random() * window.LIVE_EVENTS.length)];
      setFeed((f) => [{ ...ev, _k: Date.now() }, ...f].slice(0, 4));
      setRaised((r) => Math.min(film.goal, r + ev.amt));
    }, 4500);
    return () => clearInterval(t);
  }, [film.id]);

  const pct = Math.min(1, raised / Math.min(film.goal, goalCap));

  const tiers = isShort
    ? [{ a: 5, n: "Spark", p: "Name in credits"},
       { a: 25, n: "Reel", p: "Early access + 4K download"},
       { a: 100, n: "Patron", p: "Revenue share + signed prompt"}]
    : [{ a: 25, n: "Member", p: "Watch on release · 4K"},
       { a: 100, n: "Backer", p: "Revenue share + watchparty"},
       { a: 500, n: "Producer", p: "Set visit + on-screen credit"}];

  const amount = custom ? parseInt(custom) || 0 : tier;
  const tooMuch = amount > goalCap;

  const pledge = () => {
    if (!user) { onLogin(); return; }
    if (amount <= 0) return;
    setSuccess(true);
    setRaised((r) => Math.min(film.goal, r + amount));
    setFeed((f) => [{ name: user.name, city: "you", amt: amount, _k: Date.now() }, ...f].slice(0, 4));
    setTimeout(() => setSuccess(false), 2500);
    onPledge && onPledge(amount);
  };

  if (film.funded) {
    return (
      <section className="fund-panel">
        <div className="left">
          <div className="head">
            <span className="label" style={{color: "var(--good)"}}>FULLY FUNDED · NOW STREAMING</span>
            <span className="ddl">Released {film.year}</span>
          </div>
          <h3>This film was made by <em>{film.backers.toLocaleString()} backers</em>.</h3>
          <div className="fund-progress">
            <div className="row1">
              <div className="raised"><em>{fmt(film.goal)}</em></div>
              <div className="of">100% of <b>{fmt(film.goal)}</b> goal</div>
            </div>
            <div className="bar"><i style={{width: "100%", background: "var(--good)"}} /></div>
            <div className="row2"><span>Backers earn <b>30%</b> of ad revenue · paid quarterly</span><span><b>Q1 dividend: €0.42 / €1 pledged</b></span></div>
          </div>
          <button className="btn-fund" style={{width:"100%", background:"var(--fg)", color:"#000"}}>▶ Watch Full Film</button>
        </div>
        <div className="right">
          <div className="backers">
            <div className="lab">Top backers</div>
            {window.BACKERS.map((b, i) => (
              <div className="b" key={i}>
                <div className="av" style={{background: b.color}}>{b.name[0].toUpperCase()}</div>
                <div><div className="nm">{b.name}</div><div className="tm">{b.time}</div></div>
                <div className="am">{fmt(b.amt)}</div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  }

  return (
    <section className="fund-panel">
      <div className="left">
        <div className="head">
          <span className="label">LIVE · CROWDFUNDING</span>
          <span className="ddl">Closes in <b>{film.daysLeft} days</b> · {film.backers.toLocaleString()} backers</span>
        </div>
        <h3>Help bring <em>{film.title}</em> to the screen.</h3>

        <div className="fund-progress">
          <div className="row1">
            <div className="raised"><em>{fmt(raised)}</em></div>
            <div className="of">{Math.round(pct*100)}% of <b>{fmt(Math.min(film.goal, goalCap))}</b> goal</div>
          </div>
          <div className="bar"><i style={{width: `${pct*100}%`}} /></div>
          <div className="row2">
            <span>Min. runtime if funded: <b>{minRuntime}</b></span>
            <span>Cap: <b>{fmt(goalCap)}</b></span>
          </div>
        </div>

        {!user && (
          <div className="signed-out">
            <p>Sign in to back this film and share in its revenue.</p>
            <button onClick={onLogin}>Sign in to fund</button>
          </div>
        )}
        {user && (
          <div className="user-card">
            <div className="av">{user.name[0].toUpperCase()}</div>
            <div>
              <div className="nm">{user.name}</div>
              <div className="balance">Wallet · <b>€{user.balance.toFixed(2)}</b> credit</div>
            </div>
          </div>
        )}

        <div className="tier-grid">
          {tiers.map((t) => (
            <div key={t.a}
                 className={"tier" + ((custom === "" && tier === t.a) ? " active" : "")}
                 onClick={() => { setTier(t.a); setCustom(""); }}>
              <div className="amt">€{t.a}</div>
              <div className="nm">{t.n}</div>
              <div className="perk">{t.p}</div>
            </div>
          ))}
        </div>

        <div className="fund-row">
          <div className="fund-input">
            <span>€</span>
            <input
              type="number" min="1" max={goalCap}
              placeholder={String(tier)}
              value={custom}
              onChange={(e) => setCustom(e.target.value)}
            />
          </div>
          <button className={"btn-fund" + (success ? " success" : "")} onClick={pledge} disabled={tooMuch}>
            {success ? "✓ Pledged" : (user ? "Pledge & Watch Trailer ▶" : "Sign in to Fund")}
          </button>
        </div>
        {tooMuch && <div className="fund-meta" style={{color:"var(--accent)"}}>Single pledge can't exceed the project cap of {fmt(goalCap)}.</div>}
        {!tooMuch && <div className="fund-meta"><span className="ic">✓</span> Card not charged unless goal hits. Cancel anytime before close.</div>}
      </div>

      <div className="right">
        <div className="lab" style={{fontSize:11, letterSpacing:"0.16em", textTransform:"uppercase", color:"var(--fg-dim)", fontWeight:600, marginBottom:14}}>Live activity</div>
        <div className="live-feed">
          {feed.map((ev, i) => (
            <div className="ev" key={(ev._k || i) + "-" + i}>
              <span className="dot" />
              <span><b>{ev.name}</b> {ev.city && ev.city !== "—" ? `from ${ev.city}` : ""} just pledged</span>
              <span className="am">{fmt(ev.amt)}</span>
            </div>
          ))}
        </div>
        <div style={{marginTop:24}}>
          <div className="lab" style={{fontSize:11, letterSpacing:"0.16em", textTransform:"uppercase", color:"var(--fg-dim)", fontWeight:600, marginBottom:14}}>Recent backers</div>
          <div className="backers">
            {window.BACKERS.slice(0,4).map((b, i) => (
              <div className="b" key={i}>
                <div className="av" style={{background: b.color}}>{b.name[0].toUpperCase()}</div>
                <div><div className="nm">{b.name}</div><div className="tm">{b.time}</div></div>
                <div className="am">{fmt(b.amt)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </section>
  );
}

          <h4 style={{marginTop:24}}>Genres</h4>
          <div className="tags">
            {film.genre.split(" / ").map(g => <span className="t" key={g}>{g}</span>)}
            <span className="t">AI-generated</span>
            <span className="t">{film.year}</span>
          </div>
        </div>
      </section>

      <RulesBlock />

      <section className="more-like" style={{marginTop: 60}}>
        <h3>More Like This</h3>
        <div className="grid">
          {more.map(f => <Tile key={f.id} film={f} onOpen={onOpen} />)}
        </div>
      </section>

      <Footer />
    </div>
  );
}

window.LoginModal = LoginModal;
window.FundPanel = FundPanel;
window.RulesBlock = RulesBlock;
window.FilmDetail = FilmDetail;

</script>
<script type="text/babel">
// Madtape — main app

const { useState: useS, useEffect: useE } = React;

function App() {
  const [route, setRoute] = useS({ page: "home", filmId: null });
  const [user, setUser] = useS(null);
  const [showLogin, setShowLogin] = useS(false);

  const open = (id) => { setRoute({ page: "film", filmId: id }); window.scrollTo(0, 0); };
  const back = () => { setRoute({ page: "home", filmId: null }); window.scrollTo(0, 0); };
  const login = () => setShowLogin(true);
  const handleLogin = (u) => { setUser(u); setShowLogin(false); };
  const logout = () => setUser(null);

  const films = window.FILMS_X;
  const billboard = films.find(f => f.id === "longwave") || films[0];
  const film = films.find(f => f.id === route.filmId);

  return (
    <>
      <Nav user={user} onLogin={login} onLogout={logout} onHome={back} />
      {route.page === "home" && (
        <main data-screen-label="Home">
          <Billboard film={billboard} onOpen={open} />
          <div className="rails-wrap">
            {window.RAILS.slice(0,2).map((r, i) => (
              <Rail key={i} rail={r} films={films} onOpen={open} />
            ))}
            <FundBanner />
            {window.RAILS.slice(2,3).map((r, i) => (
              <Rail key={i} rail={r} films={films} onOpen={open} top10={true} />
            ))}
            {window.RAILS.slice(3).map((r, i) => (
              <Rail key={i+10} rail={r} films={films} onOpen={open} />
            ))}
          </div>
          <Footer />
        </main>
      )}
      {route.page === "film" && film && (
        <main data-screen-label={`Film · ${film.title}`}>
          <FilmDetail film={film} user={user} onLogin={login} onBack={back} onOpen={open} />
        </main>
      )}
      {showLogin && <LoginModal onClose={() => setShowLogin(false)} onLogin={handleLogin} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
