<!-- Start Single Page Apps for GitHub Pages -->
<script type="text/javascript">
  (function(l) {
    if (l.search[1] === 'p') {
      var decoded = l.search.slice(1).split('&').map(function(s) {
        return s.replace(/~and~/g, '&')
      }).reduce(function(r, q) {
        var p = q.split('=');
        r[p[0]] = p[1];
        return r;
      }, {});
      if (decoded.p !== undefined) {
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (decoded.p || '') +
          (decoded.q ? ('?' + decoded.q) : '') +
          l.hash
        );
      }
    }
  }(window.location));
</script>
<!-- End Single Page Apps for GitHub Pages -->

<style>
:root {
  --bg: #0a0a0a;
  --bg-1: #141414;
  --bg-2: #1f1f1f;
  --fg: #ffffff;
  --fg-dim: #b3b3b3;
  --fg-faint: #555555;
  --accent: #e50914;
  --good: #46d369;
  --warn: #f5c518;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body, button, input, select, textarea, h1, h2, h3, h4, h5, h6, span, p, div, a, label, option {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif !important;
}
html, body {
  background: var(--bg);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
body { min-height: 100vh; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
img, video { display: block; max-width: 100%; }
::selection { background: var(--accent); color: #fff; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
* { scrollbar-width: thin; scrollbar-color: #333 transparent; }

/* play overlay hover via CSS (inline hover can't do this) */
div:hover .play-overlay { opacity: 1 !important; }

/* animations */
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* page entry animation */
#root > div > div { animation: fadeIn 400ms cubic-bezier(.2,.8,.2,1) both; }

/* generating spinner */
.generating::after {
  content: "";
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
  margin-left: 10px;
  vertical-align: middle;
}

/* select / input base resets */
select, input, textarea {
  color-scheme: dark;
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
}

/* focus visible ring */
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Prevent layout shift from scrollbar appearing */
html { overflow-y: scroll; }

.skip-link {
  position: absolute;
  top: -100px;
  left: 20px;
  background: var(--accent);
  color: #fff;
  padding: 10px 20px;
  z-index: 9999;
  transition: top 0.2s ease;
  font-weight: 700;
  text-decoration: none;
  border-radius: 0 0 4px 4px;
}
.skip-link:focus {
  top: 0;
}
</style>
