<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg-1: #141414;
  --bg-2: #1f1f1f;
  --fg: #ffffff;
  --fg-dim: #b3b3b3;
  --fg-faint: #555555;
  --accent: #e50914;
  --good: #46d369;
  --warn: #f5c518;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}
body { min-height: 100vh; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
img, video { display: block; max-width: 100%; }
::selection { background: var(--accent); color: #fff; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
* { scrollbar-width: thin; scrollbar-color: #333 transparent; }

/* play overlay hover via CSS (inline hover can't do this) */
div:hover .play-overlay { opacity: 1 !important; }

/* animations */
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* page entry animation */
#root > div > div { animation: fadeIn 400ms cubic-bezier(.2,.8,.2,1) both; }

/* generating spinner */
.generating::after {
  content: "";
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
  margin-left: 10px;
  vertical-align: middle;
}

/* select / input base resets */
select, input, textarea {
  color-scheme: dark;
  font-family: "Inter", system-ui, sans-serif;
}

/* focus visible ring */
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Prevent layout shift from scrollbar appearing */
html { overflow-y: scroll; }
</style>
